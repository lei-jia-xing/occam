name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rust/sqlparser-ffi -> rust/sqlparser-ffi/target"

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'
          cabal-version: 'latest'

      - name: Cache Cabal
        uses: actions/cache@v6
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project', 'rust/sqlparser-ffi/src/*.rs', 'rust/sqlparser-ffi/Cargo.toml', 'rust/sqlparser-ffi/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Update Cabal package list
        run: cabal update

      - name: Check Haskell formatting
        uses: haskell-actions/run-fourmolu@v12
        with:
          version: "0.19.0.1"
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs
            bench/**/*.hs
            Setup.hs

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.10"

      - name: Run HLint
        run: hlint src app test bench Setup.hs

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/sqlparser-ffi/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path rust/sqlparser-ffi/Cargo.toml --all-targets -- -D warnings

      - name: Build all targets
        run: cabal build all --enable-tests --ghc-options=-Werror

      - name: Run Haskell tests
        run: cabal test all --test-show-details=direct --ghc-options=-Werror

      - name: Build all targets (static-rust)
        run: cabal build all --enable-tests --ghc-options=-Werror -f static-rust

      - name: Run Haskell tests (static-rust)
        run: cabal test all --test-show-details=direct --ghc-options=-Werror -f static-rust

      - name: Run Rust tests
        run: cargo test --locked --manifest-path rust/sqlparser-ffi/Cargo.toml

      - name: Run Python benchmark tests
        run: make benchmark-test

# proof-check (cd proofs && lake build) stays nightly/manual: elan + Lean dependency setup is too heavy to cache cheaply here.

  xval-nightly:
    name: XVAL harness gate (nightly)
    runs-on: ubuntu-latest
    # Scheduled/manual only: never on the per-PR path.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'
          cabal-version: 'latest'

      - name: Update Cabal package list
        run: cabal update

      - name: Build occam (default dynamic mode)
        run: cabal build exe:occam

      - name: Run XVAL harness (default mode)
        run: python3 benchmarks/tools/cross_validate_deps.py

      - name: Run XVAL harness (--fk-on mode)
        run: python3 benchmarks/tools/cross_validate_deps.py --fk-on --out /tmp/xval_fk_on.json
