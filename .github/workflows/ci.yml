name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up GHC and Cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.10'
          cabal-version: 'latest'

      - name: Cache Cabal
        uses: actions/cache@v6
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Update Cabal package list
        run: cabal update

      - name: Check Haskell formatting
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.19.0.1"
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs
            bench/**/*.hs
            eval-lib/**/*.hs

      # Manual install: haskell-actions/hlint-setup@v2 is node20-based (removed from
      # runners in fall 2026) with no newer release; 3.10 is the latest HLint.
      - name: Set up HLint
        run: |
          curl -sSL -o /tmp/hlint.tar.gz https://github.com/ndmitchell/hlint/releases/download/v3.10/hlint-3.10-x86_64-linux.tar.gz
          mkdir -p /tmp/hlint-bin && tar -xzf /tmp/hlint.tar.gz -C /tmp/hlint-bin
          echo "$(dirname "$(find /tmp/hlint-bin -name hlint -type f | head -n 1)")" >> "$GITHUB_PATH"

      - name: Run HLint
        run: hlint src app test bench eval-lib

      - name: Build all targets
        run: cabal build all --enable-tests --enable-benchmarks --ghc-options=-Werror

      - name: Run Haskell tests
        run: cabal test all --test-show-details=direct --ghc-options=-Werror

      - name: Run harness contract tests
        run: make harness-check

      - name: Run benchmarks
        run: make bench bench-product

# proof-check (cd proofs && lake build) stays nightly/manual: elan + Lean dependency setup is too heavy to cache cheaply here.
